name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shelfsync_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: shelfsync_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shelfsync_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHELFSYNC_TEST_CONNECTION: Host=localhost;Database=shelfsync_test;Username=shelfsync_test;Password=local-ci-only
      PGPASSWORD: local-ci-only
      ConnectionStrings__ShelfSync: Host=localhost;Database=shelfsync_test;Username=shelfsync_test;Password=local-ci-only
      Stripe__Enabled: 'false'
      SHELFSYNC_SMOKE_PRODUCT: f0000000-0000-4000-8000-000000000001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
        env:
          DOTNET_INSTALL_DIR: /usr/share/dotnet
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: psql -h localhost -U shelfsync_test -d shelfsync_test -v ON_ERROR_STOP=1 -f database/schema.sql
      - run: for pass in 1 2; do for file in database/migrations/*.sql; do psql -h localhost -U shelfsync_test -d shelfsync_test -v ON_ERROR_STOP=1 -f "$file"; done; done
      - run: dotnet test tests/ShelfSync.Tests -c Release
      - name: Seed isolated published API fixture
        run: psql -h localhost -U shelfsync_test -d shelfsync_test -v ON_ERROR_STOP=1 -f database/ci-fixture.sql
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --omit=dev
      - name: Verify release integrity tools
        shell: pwsh
        run: ./scripts/Test-ReleaseTools.ps1
      - name: Verify published authentication, roles and transport
        shell: pwsh
        run: |
          dotnet publish backend/ShelfSync.Api/ShelfSync.Api.csproj -c Release -o artifacts/ci-publish
          if ($LASTEXITCODE) { throw 'Publish failed.' }
          Copy-Item frontend/dist artifacts/ci-publish/wwwroot -Recurse
          ./scripts/Verify-Http.ps1 -Published -PublishDirectory artifacts/ci-publish
          ./scripts/Verify-Http.ps1 -Published -ProductionHttpChecks -PublishDirectory artifacts/ci-publish
          ./scripts/Verify-Access.ps1 -PublishDirectory artifacts/ci-publish
      - run: docker build -t shelfsync:ci .
