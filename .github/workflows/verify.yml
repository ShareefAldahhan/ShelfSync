name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shelfsync_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: shelfsync_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shelfsync_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHELFSYNC_TEST_CONNECTION: Host=localhost;Database=shelfsync_test;Username=shelfsync_test;Password=local-ci-only
      PGPASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: psql -h localhost -U shelfsync_test -d shelfsync_test -v ON_ERROR_STOP=1 -f database/schema.sql
      - run: dotnet test tests/ShelfSync.Tests -c Release
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - run: docker build -t shelfsync:ci .
